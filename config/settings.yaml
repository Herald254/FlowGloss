- 配置本地模型路径（OCR、NER模型文件位置）
- 设置系统行为参数（触发延迟、缓存策略等）

整体作用：
提供无需修改代码即可调整系统行为的能力，实现配置与代码分离。

联系：
被utils/config_loader.py读取，解析后通过配置管理器供全模块共享使用。
"""