# 本地覆盖：config/settings.local.yaml（不提交）。
# LLM 连接配置从项目 .env 读取；FLOWGLOSS_* 进程环境变量优先。
capture:
  monitor_index: 1
  region: null  # [left, top, width, height]，相对于选定显示器
  debounce_seconds: 1.0
  cooldown_seconds: 8.0
  change_threshold: 0.02
ocr:
  confidence_threshold: 0.5
  min_text_length: 12
llm:
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key: ''
  timeout_seconds: 20.0
  max_context_chars: 3000
  max_terms: 3
  user_profile: 熟悉 Python 基础和常见 API，但不熟悉陌生领域的专业术语。
storage:
  database_path: data/flowgloss.db
  cache_hours: 24
ui:
  opacity: 0.95
  auto_start: false
